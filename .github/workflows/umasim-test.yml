name: umasim-test
on:
  push:
    branches: ["workbench/**"]
  workflow_dispatch:

permissions:
  contents: read

# 同分支新提交直接取消旧 run，防多 commit 拆分推送堆队列
concurrency:
  group: umasim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: overflow-slack 复现报告（不打补丁=上游基线，VERDICT 行呈现红绿；cliff RED=证据墙）
        run: |
          set -o pipefail
          cargo test --release -p umasim --test overflow_slack_repro -- --nocapture 2>&1 | tee repro-report.txt
      - name: 上传复现报告（基线）
        uses: actions/upload-artifact@v4
        with:
          name: repro-report-base
          path: repro-report.txt
  repro-patched:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 逐件应用补丁（bash -e 首个失败件即定位；顺序=0001 → 0003a-d → 0004a-d → 0005转正）
        run: |
          git apply --verbose patches/0001-reserve-penalty-clamp.patch
          git apply --verbose patches/0003-a-struct-field.patch
          git apply --verbose patches/0003-b-default-impl.patch
          git apply --verbose patches/0003-c-dynamic-vital.patch
          git apply --verbose patches/0003-d-token.patch
          git apply --verbose patches/0004-a-struct-field.patch
          git apply --verbose patches/0004-b-default-impl.patch
          git apply --verbose patches/0004-c-reserve-r.patch
          git apply --verbose patches/0004-d-token-rera.patch
          git apply --verbose patches/0005-promote-rclamp.patch
          git apply --verbose patches/0006-cap-discount-floor.patch
          git apply --verbose patches/0007-rest-year-damp.patch
          git apply --verbose patches/0008-cap-slack.patch
      - name: 打补丁后复现报告（cliff 应转 GREEN=0005 转正自证；rera 读数 GREEN/SKIP）
        run: |
          set -o pipefail
          cargo test --release -p umasim --test overflow_slack_repro -- --nocapture 2>&1 | tee repro-report.txt
      - name: 上传复现报告（补丁后）
        uses: actions/upload-artifact@v4
        with:
          name: repro-report-patched
          path: repro-report.txt
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 应用补丁（运行期，逐件定位失败半径）
        run: |
          git apply --verbose patches/0001-reserve-penalty-clamp.patch
          git apply --verbose patches/0003-a-struct-field.patch
          git apply --verbose patches/0003-b-default-impl.patch
          git apply --verbose patches/0003-c-dynamic-vital.patch
          git apply --verbose patches/0003-d-token.patch
          git apply --verbose patches/0004-a-struct-field.patch
          git apply --verbose patches/0004-b-default-impl.patch
          git apply --verbose patches/0004-c-reserve-r.patch
          git apply --verbose patches/0004-d-token-rera.patch
          git apply --verbose patches/0005-promote-rclamp.patch
          git apply --verbose patches/0006-cap-discount-floor.patch
          git apply --verbose patches/0007-rest-year-damp.patch
          git apply --verbose patches/0008-cap-slack.patch
      - name: A/B bench v10（转正自检 A≡B + 留档哨兵 + G/H/I 三新臂首测，九臂同种子，release）
        run: cargo test --release -p umasim --test overflow_slack_bench -- --nocapture
  libtests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: umasim lib tests (debug) —— 上游既有基线红，不背不藏（红线4）
        run: cargo test -p umasim --lib
  libtest-tri:
    # 一次性定性工作：上游基线 4 红是竞态/调试断言/真腐化？跑完出数据后可删本 job
    if: ${{ github.event_name == 'workflow_dispatch' || true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 三制定性（并行debug / 单线程debug / release并行），只报失败名单与panic摘要
        run: |
          summarize() {
            echo "=== $1 ==="
            grep -E '\.\.\. FAILED' /tmp/t.log || echo "  (无 FAILED 行)"
            grep -cE 'panicked at' /tmp/t.log | xargs echo "  panicked-at 行数:"
            grep -A6 'panicked at' /tmp/t.log | head -c 9000
            grep -E 'test result' /tmp/t.log
          }
          cargo test -p umasim --lib           -- --test-threads=8 > /tmp/t.log 2>&1 || true; summarize "debug 8线程"
          cargo test -p umasim --lib           -- --test-threads=1 > /tmp/t.log 2>&1 || true; summarize "debug 单线程"
          cargo test --release -p umasim --lib -- --test-threads=8 > /tmp/t.log 2>&1 || true; summarize "release 8线程"
