name: umasim-test
on:
  push:
    branches: ["workbench/**"]
  workflow_dispatch:

permissions:
  contents: read

# 同分支新提交直接取消旧 run，防多 commit 拆分推送堆队列
concurrency:
  group: umasim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: overflow-slack 复现报告（不打补丁，release，VERDICT 行呈现红绿，不拿 panic 当门）
        run: |
          set -o pipefail
          cargo test --release -p umasim --test overflow_slack_repro -- --nocapture 2>&1 | tee repro-report.txt
      - name: 上传复现报告（基线）
        uses: actions/upload-artifact@v4
        with:
          name: repro-report-base
          path: repro-report.txt
  repro-patched:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 应用 0001 v2 + 0003 拆分件（逐件应用，bash -e 首个失败件即定位）
        run: |
          git apply --verbose patches/0001-reserve-penalty-clamp.patch
          git apply --verbose patches/0003-a-struct-field.patch
          git apply --verbose patches/0003-b-default-impl.patch
          git apply --verbose patches/0003-c-dynamic-vital.patch
          git apply --verbose patches/0003-d-token.patch
      - name: 打补丁后复现报告（rclamp 臂应 GREEN、rclamp_trains 生效；release 模式）
        run: |
          set -o pipefail
          cargo test --release -p umasim --test overflow_slack_repro -- --nocapture 2>&1 | tee repro-report.txt
      - name: 上传复现报告（补丁后）
        uses: actions/upload-artifact@v4
        with:
          name: repro-report-patched
          path: repro-report.txt
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 应用补丁（运行期，逐件定位失败半径）
        run: |
          git apply --verbose patches/0001-reserve-penalty-clamp.patch
          git apply --verbose patches/0003-a-struct-field.patch
          git apply --verbose patches/0003-b-default-impl.patch
          git apply --verbose patches/0003-c-dynamic-vital.patch
          git apply --verbose patches/0003-d-token.patch
      - name: A/B bench v8（base/rclamp/vcurve/both/vcurve30 五臂，同种子确定性，release）
        run: cargo test --release -p umasim --test overflow_slack_bench -- --nocapture
  libtests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: umasim lib tests (debug)
        run: cargo test -p umasim --lib
