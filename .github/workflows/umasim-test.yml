name: umasim-test
on:
  push:
    branches: ["workbench/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: overflow-slack repro（修复前预期红=复现，修复后应绿）
        run: cargo test -p umasim --test overflow_slack_repro -- --nocapture
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 诊断补丁上下文（policy.rs 46-54 行，带行号与边界标记）
        run: |
          awk 'NR>=46 && NR<=54 {printf "%d|%s|\n", NR, $0}' crates/umasim/src/game/ramen/policy.rs
          grep -n "心情低于此值" crates/umasim/src/game/ramen/policy.rs | head -3
      - name: 应用实验补丁（运行期，不提交回分支；recount 防头行数误差）
        run: git apply --recount --verbose patches/0001-reserve-penalty-clamp.patch patches/0002-gate-low-risk-exemption.patch
      - name: A/B bench（同种子确定性，7 臂解药对照）
        run: cargo test --release -p umasim --test overflow_slack_bench -- --nocapture
  libtests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: umasim lib tests (debug)
        run: cargo test -p umasim --lib
