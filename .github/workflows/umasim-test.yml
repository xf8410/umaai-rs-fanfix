name: umasim-test
on:
  push:
    branches: ["workbench/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: overflow-slack repro（修复前预期红=复现，修复后应绿）
        run: cargo test -p umasim --test overflow_slack_repro -- --nocapture
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: A/B bench（A=生产preset含bug，B=预留模型off=影响上界代理）
        run: cargo test --release -p umasim --test overflow_slack_bench -- --nocapture
  libtests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: umasim lib tests (debug) — 失败清单对照上游 pre-existing 基线
        run: |
          cargo test -p umasim --lib 2>&1 | tee /tmp/lt.log
          status=${PIPESTATUS[0]}
          echo "===== FAILED LIST ====="
          grep -E '^test .* \.\.\. FAILED$' /tmp/lt.log || echo "(none)"
          echo "===== RESULT LINES ====="
          grep -E 'test result:' /tmp/lt.log || true
          exit $status
