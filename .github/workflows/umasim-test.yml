name: umasim-test
on:
  push:
    branches: ["workbench/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: overflow-slack repro（不打补丁：满体力睡觉复现红=bug在案；rclamp 臂自动跳过）
        run: cargo test -p umasim --test overflow_slack_repro -- --nocapture
  repro-patched:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 应用 0001 v2（上限软化，配置门控）
        run: git apply --verbose patches/0001-reserve-penalty-clamp.patch
      - name: 打补丁后 repro（rclamp 臂必须绿；主臂仍红直到 preset 采纳）
        run: cargo test -p umasim --test overflow_slack_repro -- --nocapture
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 应用 0001 v2（运行期，不提交回分支）
        run: git apply --verbose patches/0001-reserve-penalty-clamp.patch
      - name: A/B bench（preset vs rclamp，同种子确定性）
        run: cargo test --release -p umasim --test overflow_slack_bench -- --nocapture
  libtests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: umasim lib tests (debug)
        run: cargo test -p umasim --lib
