name: umasim-test
on:
  push:
    branches: ["workbench/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: overflow-slack repro（修复前预期红=复现，修复后应绿）
        run: cargo test -p umasim --test overflow_slack_repro -- --nocapture
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 应用实验补丁（运行期，不提交回分支）
        # 注：不用 --recount——recount 会把多文件补丁里下一段的 "--- a/..." 头
        # 当删除行吞进 hunk；头行数已逐 hunk 校准（0001: 8/13；0002: 4/10,4/5,4/23,4/11）。
        run: git apply --verbose patches/0001-reserve-penalty-clamp.patch patches/0002-gate-low-risk-exemption.patch
      - name: A/B bench（同种子确定性，7 臂解药对照）
        run: cargo test --release -p umasim --test overflow_slack_bench -- --nocapture
  libtests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: umasim lib tests (debug)
        run: cargo test -p umasim --lib
